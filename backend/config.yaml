# ============================================================
# Revolcast 默认配置文件
# 任何字段均可被环境变量覆盖，规则：REVOLCAST_<SECTION>_<KEY>
# 例如：REVOLCAST_DATABASE_PGHOST=192.168.1.10
# ============================================================

app:
  name: "Revolcast"
  env: "development"   # development | production
  host: "0.0.0.0"
  port: "8080"

# 日志：format=json 便于接入 ELK / Loki；output 支持 console / file / both
log:
  level: "info"        # debug | info | warn | error
  format: "json"       # json | console
  output: "both"    # console | file | both
  filepath: "logs/revolcast.log"

# PostgreSQL（pgx）
database:
  pghost: "localhost"
  pgport: 5432
  pguser: "postgres"
  pgpassword: "123456"
  dbname: "revolcast"
  sslmode: "disable"

# MongoDB
mongodb:
  mongohost: "localhost"
  mongoport: 27017
  mongouser: "revolcast"
  mongopassword: "revolcast"
  dbname: "revolcast"

# Redis
redis:
  redishost: "localhost"
  redisport: 6379
  redispassword: ""
  db: 0

ws:
  addr: "localhost:8080"
  token: "123"
  # 浏览器 WebSocket 握手的 Origin 白名单（生产环境必须配置，否则拒绝所有浏览器来源）
  # 例：["https://revolcast.cn", "https://www.revolcast.cn"]
  allowed_origins: []
  # 游戏服务器在线状态采集（BIZ-012）：周期与单次回执超时（秒）。
  # 状态快照 Redis TTL = 3 × 周期（默认 180s）。
  status_poll_interval_seconds: 60
  status_poll_timeout_seconds: 5

# 业务队列（Worker Pool）：生产者-消费者模型，readPump 投递、业务 Handler 消费
queue:
  workers: 16                 # Worker 协程数，建议 ≈ Mongo 连接池上限的 1/2
  queue_size: 4096            # 有界队列容量，务必有界以防 OOM
  enqueue_timeout_ms: 200     # 队列满时投递最长等待，超时即丢弃（背压）
  task_timeout_ms: 5000       # 单条任务处理上限，防止一个卡死的 handler 占死 Worker
