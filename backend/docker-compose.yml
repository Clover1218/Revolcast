services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # 通过 REVOLCAST_ 前缀环境变量覆盖配置，无需修改 config.yaml
      REVOLCAST_APP_ENV: production
      REVOLCAST_DATABASE_PGHOST: postgres
      REVOLCAST_DATABASE_PGPORT: "5432"
      REVOLCAST_DATABASE_PGUSER: revolcast
      REVOLCAST_DATABASE_PGPASSWORD: revolcast
      REVOLCAST_DATABASE_DBNAME: revolcast
      REVOLCAST_MONGODB_MONGOHOST: mongodb
      REVOLCAST_MONGODB_MONGOPORT: "27017"
      REVOLCAST_MONGODB_MONGOUSER: revolcast
      REVOLCAST_MONGODB_MONGOPASSWORD: revolcast
      REVOLCAST_MONGODB_DBNAME: revolcast
      REVOLCAST_REDIS_REDISHOST: redis
      REVOLCAST_REDIS_REDISPORT: "6379"
    depends_on:
      - postgres
      - mongodb
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: revolcast
      POSTGRES_PASSWORD: revolcast
      POSTGRES_DB: revolcast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: revolcast
      MONGO_INITDB_ROOT_PASSWORD: revolcast
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  mongodata:
